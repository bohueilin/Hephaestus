[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hephaestus-lab"
version = "0.1.0"
description = "An evidence-gated lab for agent-participated torch.compile optimization"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2,<3",
  "PyYAML>=6,<7",
  "torch==2.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
hephaestus = "hephaestus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]

[tool.hatch.build.targets.wheel.force-include]
"gates/default.yaml" = "hephaestus/gates/default.yaml"

[tool.pytest.ini_options]
addopts = "--strict-markers"
# Torch 2.13 imports an unused JIT decorator on Python 3.14 while torch.compile works;
# suppress only that version-pinned upstream compatibility warning.
filterwarnings = [
  'ignore:^`torch\.jit\.script_method` is not supported in Python 3\.14\+ and may break\. Please switch to `torch\.compile` or `torch\.export`\.$:DeprecationWarning:^torch\.jit\._script$',
]
markers = [
  "slow: real torch.compile integration tests",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
